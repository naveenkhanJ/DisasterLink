<!DOCTYPE html>
<!-- Shared layout fragments for every officer page (implementation-standards §4).
     The current user comes from the model attribute "currentUser" (initials, name, role) — the fixed demo
     user per role (standards §1). The sidebar hrefs are placeholders until the controllers' routes exist. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
<meta charset="utf-8"><title th:text="${title} + ' — DMC Sri Lanka'">DMC Sri Lanka</title>
<link rel="stylesheet" href="../../static/css/app.css" th:href="@{/css/app.css}">
</head>
<body>

<aside class="sidebar" th:fragment="sidebar-dmc(active)"><div class="brand"><span class="brand__badge">DMC</span>DMC Sri Lanka</div><nav class="nav"><a class="nav__item" th:classappend="${active == 'Warnings'} ? 'is-active'" href="#" th:href="@{/warning}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>Warnings</a><a class="nav__item" th:classappend="${active == 'Analytics'} ? 'is-active'" href="#" th:href="@{/analytics}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M8 17V11"/><path d="M13 17V7"/><path d="M18 17v-4"/></svg>Analytics</a><button type="button" class="nav__item nav__item--soon" data-soon="Hazards"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.3A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 .5 9"/><path d="m13 12-3 5h4l-3 5"/></svg><span><span class="nav__label">Hazards</span><span class="soon-tag">Not in this version</span></span></button><button type="button" class="nav__item nav__item--soon" data-soon="Operational picture"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg><span><span class="nav__label">Operational picture</span><span class="soon-tag">Not in this version</span></span></button></nav></aside>

<aside class="sidebar" th:fragment="sidebar-duty(active)"><div class="brand"><span class="brand__badge">DMC</span>DMC Sri Lanka</div><nav class="nav"><a class="nav__item" th:classappend="${active == 'Verification'} ? 'is-active'" href="#" th:href="@{/hazardreport}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h8"/></svg>Verification</a><a class="nav__item" th:classappend="${active == 'Warnings'} ? 'is-active'" href="#" th:href="@{/warning}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>Warnings</a><a class="nav__item" th:classappend="${active == 'Analytics'} ? 'is-active'" href="#" th:href="@{/analytics}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M8 17V11"/><path d="M13 17V7"/><path d="M18 17v-4"/></svg>Analytics</a><button type="button" class="nav__item nav__item--soon" data-soon="Hazards"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.3A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 .5 9"/><path d="m13 12-3 5h4l-3 5"/></svg><span><span class="nav__label">Hazards</span><span class="soon-tag">Not in this version</span></span></button><button type="button" class="nav__item nav__item--soon" data-soon="Operational picture"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg><span><span class="nav__label">Operational picture</span><span class="soon-tag">Not in this version</span></span></button></nav></aside>

<aside class="sidebar" th:fragment="sidebar-district(active)"><div class="brand"><span class="brand__badge">DMC</span>DMC Sri Lanka</div><nav class="nav"><a class="nav__item" th:classappend="${active == 'Shelters'} ? 'is-active'" href="#" th:href="@{/shelter}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>Shelters</a><button type="button" class="nav__item nav__item--soon" data-soon="Rescue teams"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span><span class="nav__label">Rescue teams</span><span class="soon-tag">Not in this version</span></span></button><button type="button" class="nav__item nav__item--soon" data-soon="Relief resources"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span><span class="nav__label">Relief resources</span><span class="soon-tag">Not in this version</span></span></button></nav></aside>

<aside class="sidebar" th:fragment="sidebar-org(active)"><div class="brand"><span class="brand__badge">DMC</span>DMC Sri Lanka</div><nav class="nav"><a class="nav__item" th:classappend="${active == 'Shared reports'} ? 'is-active'" href="#" th:href="@{/organisation}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h8"/></svg>Shared reports</a><button type="button" class="nav__item nav__item--soon" data-soon="Resources"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span><span class="nav__label">Resources</span><span class="soon-tag">Not in this version</span></span></button><button type="button" class="nav__item nav__item--soon" data-soon="Donations"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg><span><span class="nav__label">Donations</span><span class="soon-tag">Not in this version</span></span></button></nav></aside>

<header class="topbar" th:fragment="topbar(title)">
<div><h1 class="topbar__title" th:text="${title}">Title</h1><p class="topbar__subtitle" th:utext="${subtitle}">Subtitle</p></div>
<div class="user"><span class="user__avatar" th:text="${currentUser.initials}">NJ</span>
<div><div class="user__name" th:text="${currentUser.name}">N. Jayasinghe</div><div class="user__role" th:text="${currentUser.role}">DMC Officer</div></div></div>
</header>

<!-- Common error banner (MD §0.10 C1): shown at the top of the content area on a 5xx reply; nothing was changed. -->
<div class="error-banner" role="alert" th:fragment="errorBanner" th:if="${serviceUnavailable}">
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span>The service is unavailable and nothing was changed. Please try again.</span></div>
<!-- Asset fragments for the pages (implementation-standards section 1).
     mapAssets: Leaflet (CSS and JS), districts.js and district-map.js in the order they must load, for a page
     that has a district-map element; use it just before the closing body tag:
     <th:block th:replace="~{fragments/layout :: mapAssets}"></th:block>
     chartAssets: the Chart.js UMD build, for UC4's charts; load it before the page's chart script.
     The prototype pages keep their explicit tags, which have the same effect. -->
<th:block th:fragment="mapAssets"><link rel="stylesheet" th:href="@{/vendor/leaflet-1.9.4/leaflet.css}"><script th:src="@{/vendor/leaflet-1.9.4/leaflet.js}"></script><script th:src="@{/js/districts.js}"></script><script th:src="@{/js/district-map.js}"></script></th:block>
<th:block th:fragment="chartAssets"><script th:src="@{/vendor/chartjs-4.4.4/chart.umd.js}"></script></th:block>
</body>
</html>
