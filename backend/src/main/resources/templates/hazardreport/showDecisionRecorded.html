<!DOCTYPE html>
<!--/* WF2C-S02e — "Report verified"; S02f — "Report rejected". Server-rendered by
     hazardreport.web.VerificationConsoleUI (UC2-4). The fragment body is also used by showEscalationPrompt. */-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Report ' + ${page.report.reportId})}">
<meta charset="utf-8"><title>Report — DMC Sri Lanka</title>
<link rel="stylesheet" href="../../static/css/app.css">
</head>
<body>
<div class="app">
<aside class="sidebar" th:replace="~{fragments/layout :: sidebar-duty('Verification')}"></aside>
<div class="main">
<header class="topbar" th:replace="~{fragments/layout :: topbar('Report ' + ${page.report.reportId})}"></header>
<main class="page" th:fragment="decisionBody(page)">
<div th:replace="~{fragments/layout :: errorBanner}"></div>
<div class="grid grid--main-side"><div class="stack" th:replace="~{hazardreport/showReportDetails :: evidence(${page})}"></div><div class="stack"><section class="card ">
<p class="row" style="font-size:18px;font-weight:800" th:style="'font-size:18px;font-weight:800;color:' + (${page.decision.rejected} ? 'var(--bad-text)' : 'var(--ok-text)')"><svg th:unless="${page.decision.rejected}" class="icon" style="width:22px;height:22px" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><svg th:if="${page.decision.rejected}" class="icon" style="width:22px;height:22px" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg><th:block th:text="${page.decision.rejected} ? 'Report rejected' : 'Report verified'">Report verified</th:block></p>
<div style="margin-top:12px"><dl class="details"><dt>Report ID</dt><dd th:text="${page.decision.reportId}">RPT-2026-KLT-0847</dd>
<th:block th:unless="${page.decision.rejected}"><dt>Linked hazard</dt><dd th:text="${page.decision.linkedHazard}">Flood — Kalu Ganga at Ratnapura (HZ-2026-0142)</dd><dt>Verified by</dt><dd th:text="${page.decision.decidedBy}">K. Perera</dd><dt>Verification time</dt><dd th:text="${page.decision.decisionTime}">21 May 2026, 08:15</dd></th:block>
<th:block th:if="${page.decision.rejected}"><dt>Reason</dt><dd class="si" th:text="${page.decision.reason}">The reason as typed</dd><dt>Rejected by</dt><dd th:text="${page.decision.decidedBy}">K. Perera</dd><dt>Decision time</dt><dd th:text="${page.decision.decisionTime}">21 May 2026, 08:15</dd></th:block></dl></div>
<div style="margin-top:16px"><a class="btn btn--secondary" th:href="@{/hazardreport}">Back to queue</a></div></section></div></div>
</main>
</div>
</div>
<script src="../../static/js/nav-notice.js" th:src="@{/js/nav-notice.js}"></script>
<script src="../../static/js/districts.js" th:src="@{/js/districts.js}"></script><link rel="stylesheet" th:href="@{/vendor/leaflet-1.9.4/leaflet.css}"><script th:src="@{/vendor/leaflet-1.9.4/leaflet.js}"></script><script src="../../static/js/district-map.js" th:src="@{/js/district-map.js}"></script>
</body>
</html>
