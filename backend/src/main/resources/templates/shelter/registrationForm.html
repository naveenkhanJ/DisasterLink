<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register Emergency Shelter')}"></head>
<body data-shelter-page="true" th:attr="data-officer-id=${officerId}">
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar-district('Shelters')}"></aside>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('Register Emergency Shelter')}"></header>
    <main class="page">
      <div class="offline-banner notice notice--warn" role="status" hidden></div>
      <div class="notice page-notice" role="status" hidden></div>
      <section class="sync-strip" aria-label="Offline synchronisation">
        <span>Waiting for synchronisation: <strong class="pending-count">0</strong></span>
        <button type="button" class="btn btn--secondary" data-sync-now>Sync now</button>
      </section>
      <section class="notice sync-results" role="status" hidden></section>
      <div class="grid grid--main-side">
        <section class="card">
          <div class="card__head"><h2 class="card__title">Shelter details</h2></div>
          <div class="form-errors" role="alert" hidden></div>
          <form data-register-shelter-form data-district="COLOMBO" novalidate>
            <div class="stack" style="gap:12px;max-width:480px">
              <div class="field">
                <label class="label" for="name">Name</label>
                <input class="input" id="name" name="name">
              </div>
              <div class="field">
                <label class="label" for="address">Address</label>
                <input class="input" id="address" name="address">
              </div>
              <div class="field">
                <span class="label">District</span>
                <div class="input" aria-readonly="true">Colombo</div>
              </div>
              <div class="field">
                <label class="label" for="capacity">Capacity</label>
                <input class="input" id="capacity" name="capacity" inputmode="numeric">
              </div>
              <div class="field">
                <label class="label" for="contactNumber">Contact number</label>
                <input class="input" id="contactNumber" name="contactNumber">
              </div>
              <div class="field">
                <label class="label" for="operatorId">Operating organisation (optional)</label>
                <select class="select" id="operatorId" name="operatorId">
                  <option value="">None</option>
                  <option th:each="organization : ${organizations}"
                          th:value="${organization.organizationId}"
                          th:text="${organization.name}">Organization</option>
                </select>
              </div>
            </div>
            <div class="row row--end" style="margin-top:24px">
              <a class="btn btn--secondary" th:href="@{/shelter}">Cancel</a>
              <button class="btn btn--primary" type="submit">Register shelter</button>
            </div>
          </form>
        </section>
        <div class="stack">
          <div class="notice" role="status">A new shelter starts with 0 occupants and status Open.</div>
          <section class="card">
            <div class="card__head"><h2 class="card__title">Pending on this computer</h2></div>
            <p class="muted pending-empty">No entries waiting for synchronisation.</p>
            <ul class="pending-list" hidden></ul>
          </section>
        </div>
      </div>
      <a class="link" th:href="@{/shelter}">Back to shelters</a>
    </main>
  </div>
</div>
<script th:src="@{/js/nav-notice.js}"></script>
<script type="module" th:src="@{/js/shelter-page.js}"></script>
</body>
</html>
