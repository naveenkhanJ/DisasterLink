<!DOCTYPE html>
<!--/* WF2C-S01 — Verification queue. Server-rendered by hazardreport.web.VerificationConsoleUI (UC2-4): the rows come
     from the view records of VerificationConsoleMapper; no JavaScript of our own. */-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Verification queue')}">
<meta charset="utf-8"><title>Verification queue — DMC Sri Lanka</title>
<link rel="stylesheet" href="../../static/css/app.css">
</head>
<body>
<div class="app">
<aside class="sidebar" th:replace="~{fragments/layout :: sidebar-duty('Verification')}"></aside>
<div class="main">
<header class="topbar" th:replace="~{fragments/layout :: topbar('Verification queue')}"></header>
<main class="page">
<div th:replace="~{fragments/layout :: errorBanner}"></div>
<div class="grid grid--three"><section class="card "><p class="label">Pending verification</p><p class="big-number" style="margin-top:12px" th:text="${count}">3 reports</p></section></div>
<section class="card "><div class="card__head"><div><h2 class="card__title">Pending reports</h2></div></div>
<p class="muted" th:if="${#lists.isEmpty(rows)}">No reports are waiting for verification</p>
<table class="table" th:unless="${#lists.isEmpty(rows)}"><thead><tr><th>Report ID</th><th>Hazard type</th><th>District</th><th>Capture time</th><th>Reporter type</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="row : ${rows}"><td><strong th:text="${row.reportId}">RPT-2026-KLT-0843</strong></td><td th:text="${row.hazardType}">Flood</td><td th:text="${row.district}">Kalutara</td><td th:text="${row.captureTime}">21 May 2026, 07:05</td><td th:text="${row.reporterType}">Citizen</td>
<td><span class="tag tag--warn" th:text="${row.status}">Pending verification</span></td><td class="num"><a class="btn btn--secondary btn--small" th:href="@{/hazardreport/{id}(id=${row.reportId})}">View</a></td></tr></tbody></table></section>
</main>
</div>
</div>
<script src="../../static/js/nav-notice.js" th:src="@{/js/nav-notice.js}"></script>
<script src="../../static/js/districts.js" th:src="@{/js/districts.js}"></script>
</body>
</html>
