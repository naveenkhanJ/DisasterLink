<!DOCTYPE html>
<!--/* WF2C-S02a — Rejection reason and its confirmation; S02b — reason required. Server-rendered by
     hazardreport.web.VerificationConsoleUI (UC2-4): the confirmation dialog is a page state, not a script. */-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Report ' + ${page.report.reportId})}">
<meta charset="utf-8"><title>Report — DMC Sri Lanka</title>
<link rel="stylesheet" href="../../static/css/app.css">
</head>
<body>
<div class="app">
<aside class="sidebar" th:replace="~{fragments/layout :: sidebar-duty('Verification')}"></aside>
<div class="main">
<header class="topbar" th:replace="~{fragments/layout :: topbar('Report ' + ${page.report.reportId})}"></header>
<main class="page">
<div th:replace="~{fragments/layout :: errorBanner}"></div>
<div class="grid grid--main-side"><div class="stack" th:replace="~{hazardreport/showReportDetails :: evidence(${page})}"></div><div class="stack">
<section th:replace="~{hazardreport/showReportDetails :: candidates(${page}, false)}"></section>
<section class="card "><div class="card__head"><div><h2 class="card__title">Reject report</h2></div></div>
<form method="post" class="stack" style="gap:10px" th:action="@{/hazardreport/{id}/reject(id=${page.report.reportId})}">
<div class="field" th:classappend="${reasonError != null} ? 'field--error'"><label class="label" for="reason">Rejection reason *</label><textarea class="textarea si" id="reason" name="reason" rows="5" th:text="${reason}"></textarea><p class="help">Write the reason in the reporter&#x27;s language — it is sent to the reporter as typed</p>
<p class="error-text" role="alert" th:if="${reasonError != null}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg> <span th:text="${reasonError}">A rejection reason is required</span></p></div>
<div class="row"><button type="submit" class="btn btn--danger"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Reject</button><a class="btn btn--secondary" th:href="@{/hazardreport/{id}(id=${page.report.reportId})}">Cancel</a></div></form></section></div></div>
</main>
</div>
</div>
<div class="scrim" role="dialog" aria-modal="true" th:if="${confirming}"><div class="modal" style="width:520px">
<p style="font-weight:700" th:text="'Reject ' + ${page.report.reportId} + ' with this reason?'">Reject RPT-2026-KLT-0847 with this reason?</p><p class="quote si" th:text="${reason}">The reason as typed</p>
<form method="post" th:action="@{/hazardreport/{id}/reject/confirm(id=${page.report.reportId})}"><input type="hidden" name="reason" th:value="${reason}">
<div class="row row--end"><a class="btn btn--secondary" th:href="@{/hazardreport/{id}/reject(id=${page.report.reportId}, reason=${reason})}">Cancel</a><button type="submit" class="btn btn--danger"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Confirm rejection</button></div></form></div></div><script src="../../static/js/nav-notice.js" th:src="@{/js/nav-notice.js}"></script>
<script src="../../static/js/districts.js" th:src="@{/js/districts.js}"></script><link rel="stylesheet" th:href="@{/vendor/leaflet-1.9.4/leaflet.css}"><script th:src="@{/vendor/leaflet-1.9.4/leaflet.js}"></script><script src="../../static/js/district-map.js" th:src="@{/js/district-map.js}"></script>
</body>
</html>
