<!DOCTYPE html>
<!--/* WF2C-S02g — Escalation prompt: the "Report verified" page behind a server-rendered dialog (SC2 A7, 29a to 29d).
     Server-rendered by hazardreport.web.VerificationConsoleUI (UC2-4). "Escalate" links to Lakmal's start URL
     (standards section 12.3); "Not now" posts dismiss-escalation. */-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Report ' + ${page.report.reportId})}">
<meta charset="utf-8"><title>Report — DMC Sri Lanka</title>
<link rel="stylesheet" href="../../static/css/app.css">
</head>
<body>
<div class="app">
<aside class="sidebar" th:replace="~{fragments/layout :: sidebar-duty('Verification')}"></aside>
<div class="main">
<header class="topbar" th:replace="~{fragments/layout :: topbar('Report ' + ${page.report.reportId})}"></header>
<main class="page" th:replace="~{hazardreport/showDecisionRecorded :: decisionBody(${page})}"></main>
</div>
</div>
<div class="scrim" role="dialog" aria-modal="true"><div class="modal">
<p class="row" style="align-items:flex-start;flex-wrap:nowrap"><svg class="icon" style="width:22px;height:22px" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span th:text="${prompt.text}">Flood — Kalu Ganga at Ratnapura has an active warning — WRN-2026-0087, Level 2 – Amber (Be Alert), Ratnapura and Kalutara, valid until 21 May 2026 10:45. Escalate this warning?</span></p>
<p><span class="tag" th:classappend="${prompt.levelClass}" th:text="${prompt.levelLabel}">Level 2 – Amber (Be Alert)</span></p>
<div class="row row--end"><form method="post" th:action="@{/hazardreport/{id}/dismiss-escalation(id=${page.report.reportId})}"><button type="submit" class="btn btn--secondary">Not now</button></form><a class="btn btn--primary" th:href="@{/warning/{id}/escalate(id=${prompt.warningId})}">Escalate</a></div></div></div><script src="../../static/js/nav-notice.js" th:src="@{/js/nav-notice.js}"></script>
<script src="../../static/js/districts.js" th:src="@{/js/districts.js}"></script><link rel="stylesheet" th:href="@{/vendor/leaflet-1.9.4/leaflet.css}"><script th:src="@{/vendor/leaflet-1.9.4/leaflet.js}"></script><script src="../../static/js/district-map.js" th:src="@{/js/district-map.js}"></script>
</body>
</html>
