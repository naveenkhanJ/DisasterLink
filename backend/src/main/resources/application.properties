spring.application.name=disasterlink
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:h2:mem:disasterlink;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
logging.level.lk.sliit.se3070.group058.disasterlink=INFO
mock.sms.fail-recipient-prefixes=
mock.push.fail-recipient-prefixes=
# The fixed demo user of each role (no login, standards section 1). The seed data of stage S4 creates these users.
demo.users.dmc-officer-id=DMC-0001
demo.users.dmc-duty-officer-id=DMC-0002
demo.users.district-officer-id=DO-COL-01
demo.users.organization-id=ORG-0001
demo.users.citizen-id=CIT-KLT-0001
# SC4 alternate flow A3 (standards section 11): true seeds one client in Kalutara with pending items, so a report is provisional.
demo.pending-client=false
# Where report photos are stored (relative to the working directory; backend/data/ is git-ignored). Shared by the photo
# endpoint, receiveReport and the seed, which copies a placeholder JPEG under each seeded report's photo name.
photo.storage-dir=data/photos
# Upload limits for a report photo (standards §12.3, P178; Group_058 assumption, SC2 sets no size). Spring Boot's defaults
# (1 MB per file, 10 MB per request) would refuse a typical iPhone camera photo.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# A decimal where a whole number is expected (for example newTotal 350.5) is a 400, never truncated (P155 D-18).
spring.jackson.deserialization.accept-float-as-int=false
